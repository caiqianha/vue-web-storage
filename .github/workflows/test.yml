name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: dist smoke test (CommonJS require under Node, no DOM)
        run: node -e "const m = require('./dist/vue-web-storage.umd.js'); if (m.version !== require('./package.json').version) throw new Error('version mismatch'); if (m.local.get('x') !== null) throw new Error('get should be null')"
      - name: dist smoke test (Nuxt module entry resolves and exports a module)
        run: node -e "import('vue-web-super-storage/nuxt').then(m => { if (typeof m.default !== 'function') throw new Error('nuxt module missing') })"
